# ycpss91255-lab merge queue ruleset (repo-level) 設定。
#
# 組織目前是 GitHub Free 方案，組織層級 ruleset（orgs/<org>/rulesets）需要
# GitHub Team 以上，API 回 403，因此改由本檔 + script/sync-rulesets.sh 對各 repo
# 建立「repo 層級」的 `main merge queue` ruleset，做法比照 labels.yaml / topics.yaml。
#
# 流程：改本檔 -> PR review -> 合併 -> 由有各 repo admin 權限的人執行
#   script/sync-rulesets.sh --apply
# CI 執行 --validate（結構檢查）與離線測試，不會寫入任何 repo 設定。
#
# 啟用 merge queue 的前置條件（少一個佇列就會卡住或無法合併）：
#   1. repo 為 public（組織為 Free 時 private repo 不支援 ruleset / merge queue）。
#   2. 預設分支的所有必要 CI workflow 都有 `merge_group:` 觸發。
#   3. required_checks 的 check 名稱必須真的由 CI 產生，且 merge_group 事件也會跑。
#   4. merge_method 必須是 repo 設定中有開啟的合併方式。
# 條件未滿足的 repo 放在 `pending`，並寫明缺什麼；補齊後移到 `repos`。

# 所有 repo 共用的 rule 內容（與 base 的 `main merge queue` ruleset 相同）。
template:
  name: "main merge queue"
  include_ref: "~DEFAULT_BRANCH"
  github_actions_integration_id: 15368   # GitHub Actions app
  merge_queue:
    max_entries_to_build: 5
    min_entries_to_merge: 1
    max_entries_to_merge: 5
    min_entries_to_merge_wait_minutes: 5
    grouping_strategy: ALLGREEN
    check_response_timeout_minutes: 60

# 已啟用（由 sync-rulesets.sh 管理）。每個 repo 需寫：merge_method、required_checks、
# allowed_merge_methods、review_thread_resolution。
# 選填 check_response_timeout_minutes（整數，1 到 360 分鐘），預設使用
# template.merge_queue.check_response_timeout_minutes。
repos:
  base:
    merge_method: MERGE
    required_checks: [ci-rollup]
    allowed_merge_methods: [merge]
    review_thread_resolution: true
  isaac:
    merge_method: MERGE
    required_checks: [gate]
    allowed_merge_methods: [merge]
    review_thread_resolution: true
    check_response_timeout_minutes: 240
  isaac_lab:
